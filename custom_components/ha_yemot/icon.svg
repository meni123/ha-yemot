<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background transparent -->
  <rect width="512" height="512" fill="none"/>

  <!-- Left: Home Assistant House Icon -->
  <g transform="translate(30, 160) scale(0.7)">
    <path d="M128 20 L220 95 L220 220 L36 220 L36 95 Z" fill="#03a9f4" rx="16"/>
    <path d="M128 0 L256 100 L220 128 L128 50 L36 128 L0 100 Z" fill="#03a9f4"/>
    <path d="M128 90 L128 180 M128 140 L170 110 M128 150 L86 125" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <circle cx="128" cy="90" r="14" fill="#ffffff"/>
    <circle cx="170" cy="110" r="12" fill="#ffffff"/>
    <circle cx="86" cy="125" r="12" fill="#ffffff"/>
  </g>

  <!-- Center: Plus Sign -->
  <g transform="translate(230, 230)">
    <rect x="0" y="20" width="60" height="20" rx="6" fill="#78909c"/>
    <rect x="20" y="0" width="20" height="60" rx="6" fill="#78909c"/>
  </g>

  <!-- Right: Yemot Sun & Handset Icon -->
  <g transform="translate(290, 140)">
    
    <!-- Sun Group (Drawn FIRST so it stays in the background) -->
    <g transform="translate(110, 110)">
      <!-- Sun rays -->
      <line x1="0" y1="-55" x2="0" y2="-80" stroke="#ffc107" stroke-width="10" stroke-linecap="round"/>
      <line x1="0" y1="55" x2="0" y2="80" stroke="#ffc107" stroke-width="10" stroke-linecap="round"/>
      <line x1="-55" y1="0" x2="-80" y2="0" stroke="#ffc107" stroke-width="10" stroke-linecap="round"/>
      <line x1="55" y1="0" x2="80" y2="0" stroke="#ffc107" stroke-width="10" stroke-linecap="round"/>
      <line x1="-38" y1="-38" x2="-55" y2="-55" stroke="#ffc107" stroke-width="10" stroke-linecap="round"/>
      <line x1="38" y1="38" x2="55" y2="55" stroke="#ffc107" stroke-width="10" stroke-linecap="round"/>
      <line x1="-38" y1="38" x2="-55" y2="55" stroke="#ffc107" stroke-width="10" stroke-linecap="round"/>
      <line x1="38" y1="-38" x2="55" y2="-55" stroke="#ffc107" stroke-width="10" stroke-linecap="round"/>
      
      <!-- Sun circles -->
      <circle cx="0" cy="0" r="45" fill="#ffc107"/>
      <circle cx="-8" cy="-8" r="30" fill="#ffd54f"/>
    </g>

    <!-- Telephone Handset (Drawn LAST so it overlaps the sun) -->
    <g transform="translate(55, 0)">
      <path d="M 50 30 C 80 30, 80 80, 50 90 C 35 100, 35 120, 50 130 C 80 140, 80 190, 50 190 C 10 190, -10 150, -10 110 C -10 70, 10 30, 50 30 Z" fill="#d32f2f"/>
    </g>

  </g>
</svg>
